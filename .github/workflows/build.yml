name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev aidl ant

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip install cython==0.29.33

      # الخطوة الجديدة: تثبيت sdkmanager يدوياً في المسار الذي يتوقعه Buildozer
      - name: Install Android SDK Manager
        run: |
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
          cd $HOME/.buildozer/android/platform/android-sdk/tools/bin
          curl -L -O -C - https://dl.google.com/android/repository/sdk-tools-linux-4333796.zip
          unzip -o sdk-tools-linux-4333796.zip
          rm sdk-tools-linux-4333796.zip
          echo "y" | ./sdkmanager --licenses

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photototelegram-apk
          path: bin/*.apk
