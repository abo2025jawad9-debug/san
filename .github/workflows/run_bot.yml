name: Vote Bot

on:
  # تشغيل يدوي بالضغط على زر Run workflow
  workflow_dispatch:
  
  # تشغيل تلقائي كل 6 ساعات
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp==3.9.5 beautifulsoup4==4.12.3 lxml==5.2.2
      
      - name: Create names.txt
        run: |
          cat > names.txt << 'EOF'
          محمد لطف يحيى 772490746
          EOF
      
      - name: Execute Bot
        run: python bot.py
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
