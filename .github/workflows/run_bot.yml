name: Run Bot

on:
  # جدولة التشغيل كل ساعة (يمكنك تغيير التوقيت)
  schedule:
    - cron: '0 * * * *'
  # أو تشغيل يدوي من واجهة Actions
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run bot
        env:
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD_BASE: ${{ secrets.PASSWORD_BASE }}
          MAX_ATTEMPTS: ${{ secrets.MAX_ATTEMPTS }}
        run: python bot.py

      - name: Commit and push updated sh.json (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sh.json
          git diff --staged --quiet || git commit -m "Update sh.json from bot run"
          git push
        continue-on-error: true
