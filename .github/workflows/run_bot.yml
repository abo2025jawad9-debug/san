name: Vote Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */0.1 * * *'

jobs:
  run-bot-job:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi==0.6.4 beautifulsoup4==4.12.3 lxml==5.2.2
      
      - name: Create names.txt
        run: |
          cat > names.txt << 'EOF'
          محمد لطف يحيى 772490746
          محمد لطف الزيلعي 772490746
          مجمد لطف الزيلعي 772490746
          ابو جواد الزيلعي 772490746
          ابو جوري الزيلعي 772490746
          EOF
      
      - name: Execute Bot
        run: python bot.py
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
