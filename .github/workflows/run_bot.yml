name: Auto Run Bot Every 4 Hours

# تحديد متى يعمل السكربت
on:
  schedule:
    # صيغة Cron لتشغيل السكربت كل 4 ساعات (عند الدقيقة 0)
    - cron: '0 */4 * * *'
  
  # هذا الخيار يتيح لك تشغيل السكربت يدوياً بضغطة زر من واجهة GitHub
  workflow_dispatch:

jobs:
  run-bot-job:
    runs-on: ubuntu-latest

    steps:
    # الخطوة 1: استنساخ ملفات المستودع إلى بيئة التشغيل
    - name: Checkout Repository
      uses: actions/checkout@v4

    # الخطوة 2: تثبيت بيئة بايثون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # يمكنك تغييره حسب إصدار بايثون الذي تستخدمه

    # الخطوة 3: تثبيت المكتبات الخارجية المطلوبة
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # الخطوة 4: تشغيل السكربت الخاص بك
    - name: Execute Bot
      run: python bot.py
